services:
  app:
    build: .
    container_name: brasargent-app
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      - NODE_ENV=production
      - SITE_URL=https://brasargent.bo
      - HOST=0.0.0.0
      - PORT=4321
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OPENWA_API_URL=http://openwa:2785/api
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - OPENWA_ADMIN_KEY=${OPENWA_ADMIN_KEY}
      - OPENWA_DEFAULT_SESSION=${OPENWA_DEFAULT_SESSION:-brasargent}
    volumes:                                    # ← AGREGAR
      - ./public/uploads:/app/public/uploads    # ← AGREGAR
    depends_on:
      db:
        condition: service_healthy
      openwa:
        condition: service_started
    networks:
      - brasargent-network

  db:
    image: mysql:8.0
    container_name: brasargent-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - brasargent-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openwa:
    image: rmyndharis/openwa:latest
    container_name: brasargent-openwa
    restart: unless-stopped
    expose:
      - "2785"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=sqlite:./data/openwa.db
      - ENGINE_TYPE=baileys
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - API_KEY=${OPENWA_API_KEY}
      - ADMIN_KEY=${OPENWA_ADMIN_KEY}
      - WEBHOOK_URL=http://app:4321/api/webhooks/whatsapp
    volumes:
      - openwa-data:/app/data
    networks:
      - brasargent-network
  nginx:
    image: nginx:alpine
    container_name: brasargent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./public/uploads:/app/public/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - brasargent-network

volumes:
  mysql-data:
  openwa-data:

networks:
  brasargent-network:
    driver: bridge
